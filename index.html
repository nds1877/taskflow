// Ensure anonymous sign-in before any Firestore call
async function ensureAuth() {
  if (auth.currentUser) return auth.currentUser;
  return new Promise((resolve, reject) => {
    const unsub = auth.onAuthStateChanged(u => {
      if (u) { unsub(); resolve(u); }
    });
    auth.signInAnonymously().catch(err => { unsub(); reject(err); });
  });
}

const todayStr  = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
};
const todayDate = () => new Date(todayStr() + 'T00:00:00');

function taskActiveOnDate(task, dateStr) {
  if (task.active === false) return false;
  if (task.repeatType === 'everyday') return task.startDate <= dateStr;
  if (task.repeatType === 'specific') return (task.specificDates || []).includes(dateStr);
  if (task.repeatType === 'afterX') {
    if (!task.startDate || task.startDate > dateStr) return false;
    const diff = Math.round((new Date(dateStr+'T00:00:00') - new Date(task.startDate+'T00:00:00')) / 86400000);
    return diff % (parseInt(task.intervalDays) || 1) === 0;
  }
  return false;
}
const taskActiveToday = t => t.active!==false && taskActiveOnDate(t, todayStr());

function tsToDate(ts) {
  if (!ts) return null;
  if (ts.toDate) return ts.toDate();
  if (ts instanceof Date) return ts;
  return null;
}
function fmtTime(d) {
  if (!d) return '—';
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}
function calcLateMins(deadline, compDate) {
  if (!compDate || !deadline) return null;
  const [dh, dm] = deadline.split(':').map(Number);
  return (compDate.getHours() * 60 + compDate.getMinutes()) - (dh * 60 + dm);
}
function fmtLate(mins) {
  if (mins === null) return null;
  if (mins <= 0) return 'ON TIME';
  const h = Math.floor(mins / 60), m = mins % 60;
  return h > 0 ? `${h}H ${m}M` : `${m}M`;
}

function Toast({ msg, type, onClose }) {
  useEffect(() => { if (msg) { const t = setTimeout(onClose, 3000); return () => clearTimeout(t); } }, [msg]);
  if (!msg) return null;
  const cfg = { success:['#059669','✓'], error:['#dc2626','✕'], info:['#3b82f6','ℹ'] };
  const [color, icon] = cfg[type] || cfg.info;
  return (
    <div onClick={onClose} style={{
      position:'fixed', bottom:'24px', left:'50%', transform:'translateX(-50%)',
      background:color, color:'white', padding:'11px 22px', borderRadius:'50px',

      <span style={{opacity:0.8}}>{icon}</span> {msg}
    </div>
  );
}

}

function QuickAddModal({ ctx, onClose }) {

  useEffect(() => { setTimeout(() => nameRef.current?.focus(), 120); }, []);

    if (!form.name.trim() || !form.businessId || !form.departmentId) {

            <div style={{fontFamily:"'Barlow Condensed',sans-serif", fontWeight:'900', fontSize:'1.3rem', letterSpacing:'3px', color:'var(--fg)'}}>
              ✚ QUICK ADD TASK

            <button onClick={onClose} style={{background:'var(--surface2)', border:'none', color:'var(--fg3)', width:'30px', height:'30px', borderRadius:'8px', cursor:'pointer', fontSize:'1.1rem'}}>×</button>
          </div>

          {/* Task Name — big */}
          <div style={{marginBottom:'16px'}}>
            <input

              onChange={e => setForm({...form, name:e.target.value.toUpperCase()})}

              style={{

          {/* Business + Dept */}
          <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:'10px', marginBottom:'4px'}}>
            <Select value={form.businessId} onChange={e => setForm({...form, businessId:e.target.value, departmentId:''})}>
              <option value="">Business…</option>
              {businesses.map(b => <option key={b.id} value={b.id}>{b.name}</option>)}

//  MAIN APP
// ══════════════════════════════════
function App() {
  const [currentUser, setCurrentUser] = useState(() => {
    try { const raw = localStorage.getItem('tf_user'); return raw ? JSON.parse(raw) : null; } catch { return null; }
  });
  const [screen, setScreen]           = useState(() => {
    try {
      const s = localStorage.getItem('tf_screen');
      if (s) return s;
      const raw = localStorage.getItem('tf_user');
      if (raw) { const u = JSON.parse(raw); return u && u.role === 'staff' ? 'staff' : 'adminDash'; }
      return 'login';
    } catch { return 'login'; }
  });
  const [navData, setNavData]         = useState(() => {
    try { const raw = localStorage.getItem('tf_navData'); return raw ? JSON.parse(raw) : null; } catch { return null; }
  });
  const [businesses, setBusinesses]   = useState([]);
  const [departments, setDepartments] = useState([]);
  const [users, setUsers]             = useState([]);
  const [tasks, setTasks]             = useState([]);
  const [loading, setLoading]         = useState(true);
  const [toast, setToast]             = useState({ msg:'', type:'info' });
  const [isDark, setIsDark]           = useState(() => localStorage.getItem('tf_theme') === 'dark');
  const [today, setToday]             = useState(todayStr());

  // Midnight rollover + tab-focus recheck so tasks refresh at 00:00 and
  // after the tab comes back from background (mobile throttling safety).
  useEffect(() => {
    let timer;
    const syncToday = () => {
      const cur = todayStr();
      setToday(prev => prev !== cur ? cur : prev);
    };
    const scheduleMidnight = () => {
      const now = new Date();
      const next = new Date(now.getFullYear(), now.getMonth(), now.getDate()+1, 0, 0, 5);
      timer = setTimeout(() => { syncToday(); scheduleMidnight(); }, next - now);
    };
    scheduleMidnight();
    const onVis = () => { if (!document.hidden) syncToday(); };
    document.addEventListener('visibilitychange', onVis);
    window.addEventListener('focus', onVis);
    return () => {
      clearTimeout(timer);
      document.removeEventListener('visibilitychange', onVis);
      window.removeEventListener('focus', onVis);
    };
  }, []);

  const toggleTheme = () => setIsDark(v => {
    const next = !v;
    localStorage.setItem('tf_theme', next ? 'dark' : 'light');
    return next;
  });

  useEffect(() => {
    if (isDark) document.documentElement.setAttribute('data-dark','');
    else         document.documentElement.removeAttribute('data-dark');
  }, [isDark]);

  const showToast = (msg, type='info') => setToast({ msg, type });
  const hideToast = () => setToast({ msg:'', type:'info' });

  const refreshData = useCallback(async () => {
    try {
      const [bS, dS, uS, tS] = await Promise.all([
        db.collection('businesses').get(),
        db.collection('departments').get(),
        db.collection('users').get(),
        db.collection('tasks').get(),
      ]);
      setBusinesses(bS.docs.map(d => ({ id:d.id, ...d.data() })));
      setDepartments(dS.docs.map(d => ({ id:d.id, ...d.data() })));
      setUsers(uS.docs.map(d => ({ id:d.id, ...d.data() })));
      setTasks(tS.docs.map(d => ({ id:d.id, ...d.data() })));
    } catch(e) {}
  }, []);

  useEffect(() => {
    ensureAuth()
      .then(() => seedAdmin())
      .then(() => refreshData())
      .then(() => setLoading(false))
      .catch(() => setLoading(false));
  }, []);

  const navigate = (s, data=null) => {
    setScreen(s); setNavData(data);
    try {
      localStorage.setItem('tf_screen', s);
      if (data) localStorage.setItem('tf_navData', JSON.stringify(data));
      else      localStorage.removeItem('tf_navData');
    } catch {}
  };
  const logout = () => {
    try {
      localStorage.removeItem('tf_user');
      localStorage.removeItem('tf_screen');
      localStorage.removeItem('tf_navData');
      localStorage.removeItem('tf_staff');
    } catch {}
    setCurrentUser(null); setScreen('login'); setNavData(null);
  };

  if (loading) {
    return (
      <div style={{minHeight:'100vh', display:'flex', alignItems:'center', justifyContent:'center', background:'#0b1120', flexDirection:'column', gap:'16px'}}>
        <div style={{fontFamily:"'Barlow Condensed',sans-serif", fontWeight:'900', fontSize:'2.4rem', color:'#f59e0b', letterSpacing:'8px'}}>TASKFLOW</div>
        <div style={{fontFamily:"'IBM Plex Mono',monospace", fontSize:'0.68rem', color:'rgba(255,255,255,0.25)', letterSpacing:'3px'}} className="pulse">INITIALISING...</div>
      </div>
    );
  }

  const ctx = { currentUser, businesses, departments, users, tasks, navigate, refreshData, logout, showToast, navData, isDark, toggleTheme, today };

  const screens = {
    login:            <LoginScreen ctx={ctx} setCurrentUser={setCurrentUser} setScreen={setScreen} />,
    adminDash:        <AdminDashboard ctx={ctx} />,
    createBusiness:   <CreateBusiness ctx={ctx} />,
    createDepartment: <CreateDepartment ctx={ctx} />,
    createUser:       <CreateUser ctx={ctx} />,
    createTask:       <CreateTask ctx={ctx} />,
    manageBusiness:   <ManageBusiness ctx={ctx} />,
    reports:          <Reports ctx={ctx} />,
    staff:            <StaffDashboard ctx={ctx} />,
  };

  return (
    <>
      {screens[screen] || screens.login}
      <Toast msg={toast.msg} type={toast.type} onClose={hideToast} />
    </>
  );
}

function LoginScreen({ ctx, setCurrentUser, setScreen }) {
  const [userId, setUserId]     = useState('');
  const [password, setPassword] = useState('');
  const [error, setError]       = useState('');
  const [loading, setLoading]   = useState(false);
  const [showPw, setShowPw]     = useState(false);
  const pwRef = useRef();

  const login = async () => {
    if (!userId.trim() || !password) { setError('Enter User ID and Password'); return; }
    setLoading(true); setError('');
    try {
      const snap = await db.collection('users')
        .where('userId','==',userId.trim().toLowerCase())
        .where('password','==',password)
        .limit(1).get();
      if (snap.empty) { setError('Invalid credentials'); setLoading(false); return; }
      const user = { id:snap.docs[0].id, ...snap.docs[0].data() };
      if (user.disabled) { setError('Account disabled. Contact admin.'); setLoading(false); return; }
      setCurrentUser(user);
      try { localStorage.setItem('tf_user', JSON.stringify(user)); } catch {}
      const dest = user.role === 'staff' ? 'staff' : 'adminDash';
      setScreen(dest);
      try { localStorage.setItem('tf_screen', dest); localStorage.removeItem('tf_navData'); } catch {}
    } catch(e) { setError('Connection error. Check Firebase config.'); }
    setLoading(false);
  };

  const iStyle = { ...S.input, background:'rgba(255,255,255,0.06)', border:'1.5px solid rgba(255,255,255,0.1)', color:'white', fontSize:'1rem' };

  return (
    <div style={{minHeight:'100vh', background:'#0b1120', display:'flex', alignItems:'center', justifyContent:'center', padding:'20px', position:'relative', overflow:'hidden'}}>
      <div style={{position:'absolute',inset:0,backgroundImage:'repeating-linear-gradient(0deg,transparent,transparent 39px,rgba(255,255,255,0.025) 39px,rgba(255,255,255,0.025) 40px),repeating-linear-gradient(90deg,transparent,transparent 39px,rgba(255,255,255,0.025) 39px,rgba(255,255,255,0.025) 40px)',pointerEvents:'none'}}/>
      <div style={{position:'absolute',top:'-20%',left:'50%',transform:'translateX(-50%)',width:'60vw',height:'40vw',background:'radial-gradient(ellipse,rgba(245,158,11,0.12) 0%,transparent 70%)',pointerEvents:'none'}}/>
      <div style={{width:'100%', maxWidth:'360px', position:'relative'}}>
        <div style={{textAlign:'center', marginBottom:'36px'}}>
          <div style={{fontFamily:"'Barlow Condensed',sans-serif", fontWeight:'900', fontSize:'2.6rem', color:'#f59e0b', letterSpacing:'8px', lineHeight:1}}>TASKFLOW <span style={{fontSize:'1.3rem', letterSpacing:'4px', color:'rgba(245,158,11,0.6)'}}>NDC1877</span></div>
        </div>
        <div style={{background:'rgba(255,255,255,0.04)', border:'1px solid rgba(255,255,255,0.08)', borderRadius:'16px', padding:'28px 24px', backdropFilter:'blur(20px)'}}>
          <div style={{marginBottom:'16px'}}>
            <label style={{...S.label, color:'rgba(255,255,255,0.35)'}}>USER ID</label>
            <input value={userId} onChange={e=>setUserId(e.target.value)} onKeyDown={e=>e.key==='Enter'&&pwRef.current.focus()} placeholder="enter user id" autoCapitalize="none" style={iStyle} />
          </div>
          <div style={{marginBottom:'10px'}}>
            <label style={{...S.label, color:'rgba(255,255,255,0.35)'}}>PASSWORD</label>
            <div style={{position:'relative'}}>
              <input ref={pwRef} type={showPw?'text':'password'} value={password} onChange={e=>setPassword(e.target.value)} onKeyDown={e=>e.key==='Enter'&&login()} placeholder="••••••••" style={{...iStyle, paddingRight:'44px'}} />
              <button onClick={()=>setShowPw(v=>!v)} tabIndex={-1} style={{position:'absolute',right:'12px',top:'50%',transform:'translateY(-50%)',background:'none',border:'none',color:'rgba(255,255,255,0.35)',cursor:'pointer',display:'flex',alignItems:'center',padding:'4px'}}>
                {showPw
                  ? <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                  : <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                }
              </button>
            </div>
          </div>
          {error && <div style={{color:'#f87171', fontSize:'0.78rem', fontFamily:"'IBM Plex Mono',monospace", marginBottom:'14px', padding:'9px 12px', background:'rgba(239,68,68,0.1)', borderRadius:'8px', border:'1px solid rgba(239,68,68,0.2)'}}>{error}</div>}
          <button onClick={login} disabled={loading} style={{...S.btnAmber, width:'100%', padding:'15px', fontSize:'1rem', letterSpacing:'3px', marginTop:'4px', opacity:loading?0.7:1}}>

function CreateBusiness({ ctx }) {
  const { businesses, navigate, refreshData, showToast, logout, isDark, toggleTheme } = ctx;
  const [name, setName]       = useState('');
  const [editing, setEditing] = useState(null);
  const [saving, setSaving]   = useState(false);

  const save = async () => {
    if (!name.trim()) { showToast('Enter business name', 'error'); return; }
    setSaving(true);
    try {
      if (editing) { await db.collection('businesses').doc(editing.id).update({ name:name.trim() }); showToast('Updated','success'); }
      else { await db.collection('businesses').add({ name:name.trim(), createdAt:new Date() }); showToast('Business created','success'); }
      await refreshData(); setName(''); setEditing(null);
    } catch(e) { showToast('Error: '+e.message,'error'); }
    setSaving(false);
  };

  const del = async (item) => {
    if (!confirm(`Delete "${item.name}"?`)) return;
    await db.collection('businesses').doc(item.id).delete();
    await refreshData(); showToast('Deleted','success');
  };

  return (
    <div style={S.page}>
      <AdminHeader title="CREATE BUSINESS" subtitle="Step 01" onBack={() => navigate('adminDash')} onLogout={logout} isDark={isDark} onToggleDark={toggleTheme} navigate={navigate} currentScreen="createBusiness" />
      <div style={S.section} className="desktop-grid">
        <FormCard>
          <Input label="Business Name" value={name} onChange={e=>setName(e.target.value)} placeholder="e.g. Narayandas Sweets" onKeyDown={e=>e.key==='Enter'&&save()} prefix="🏢" />
          <div style={{display:'flex', gap:'10px'}}>

function CreateUser({ ctx }) {
  const { users, businesses, departments, navigate, refreshData, showToast, logout, isDark, toggleTheme } = ctx;
  const blank = { userId:'', password:'', role:'staff', businessId:'', departmentId:'', name:'', contact:'', dateOfJoining:'', disabled:false };
  const [form, setForm]       = useState(blank);
  const [editing, setEditing] = useState(null);
  const [saving, setSaving]   = useState(false);
  const [showPw, setShowPw]   = useState(false);

  const isAdmin       = form.role === 'admin';
  const filteredDepts = departments.filter(d => d.businessId === form.businessId);
  const staffUsers    = users.filter(u => u.role === 'staff');
  const adminUsers    = users.filter(u => u.role === 'admin');

  const save = async () => {
    if (!form.userId||!form.password||!form.name) { showToast('Fill required fields','error'); return; }
    if (!isAdmin&&(!form.businessId||!form.departmentId)) { showToast('Assign business & dept for staff','error'); return; }
    setSaving(true);
    try {
      const data = { ...form, userId:form.userId.toLowerCase().trim(), updatedAt:new Date(), ...(isAdmin?{businessId:'',departmentId:''}:{}) };
      if (editing) { await db.collection('users').doc(editing.id).update(data); showToast('Updated','success'); }
      else {
        const dup = await db.collection('users').where('userId','==',data.userId).limit(1).get();
        if (!dup.empty) { showToast('User ID already exists','error'); setSaving(false); return; }
        await db.collection('users').add({...data,createdAt:new Date()}); showToast('User created','success');
      }
      await refreshData(); setForm(blank); setEditing(null);
    } catch(e) { showToast('Error: '+e.message,'error'); }
    setSaving(false);
  };

  const del = async (item) => {
    if (item.userId==='admin') { showToast('Cannot delete default admin','error'); return; }
    if (!confirm(`Delete "${item.name}"?`)) return;
    await db.collection('users').doc(item.id).delete();
    await refreshData(); showToast('Deleted','success');
  };

  const getBizName  = id => businesses.find(b=>b.id===id)?.name||'—';
  const getDeptName = id => departments.find(d=>d.id===id)?.name||'—';

    <div style={S.page}>

          <div style={{marginBottom:'16px'}}>
            <label style={S.label}>Access Role</label>
            <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:'8px'}}>
              {['staff','admin'].map(r => (
                <div key={r} onClick={() => setForm({...form,role:r,businessId:'',departmentId:''})} style={{
                  padding:'12px', borderRadius:'10px',
                  border:`2px solid ${form.role===r?(r==='admin'?'#f59e0b':'#6366f1'):'var(--border)'}`,
                  background: form.role===r?(r==='admin'?'#fffbeb':'#eef2ff'):'var(--surface2)',
                  cursor:'pointer', textAlign:'center', transition:'all 0.15s'
                }}>
                  <div style={{fontSize:'1.4rem', marginBottom:'4px'}}>{r==='admin'?'🔑':'👷'}</div>
                  <div style={{fontFamily:"'Barlow Condensed',sans-serif", fontWeight:'800', fontSize:'0.85rem', letterSpacing:'1px', color:form.role===r?(r==='admin'?'#d97706':'#4f46e5'):'var(--fg3)'}}>{r.toUpperCase()}</div>
                </div>
              ))}
            </div>
          </div>

          <Divider label="Credentials" />
          <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:'0 12px'}}>
            <Input label="User ID *" value={form.userId} onChange={e=>setForm({...form,userId:e.target.value})} placeholder="staff01" hint="lowercase, no spaces" />
            <div style={{marginBottom:'14px'}}>
              <label style={S.label}>Password *</label>
              <div style={{position:'relative'}}>
                <input type={showPw?'text':'password'} value={form.password} onChange={e=>setForm({...form,password:e.target.value})} placeholder="set password" style={{...S.input,paddingRight:'40px'}} />
                <button onClick={()=>setShowPw(!showPw)} style={{position:'absolute',right:'10px',top:'50%',transform:'translateY(-50%)',background:'none',border:'none',cursor:'pointer',fontSize:'0.85rem',color:'var(--fg3)'}}>
                  {showPw?'🙈':'👁'}
                </button>
              </div>
            </div>
          </div>

          <Divider label="Personal Info" />
          <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:'0 12px'}}>
            <Input label="Full Name *" value={form.name} onChange={e=>setForm({...form,name:e.target.value})} placeholder="full name" />
            <Input label="Contact" value={form.contact} onChange={e=>setForm({...form,contact:e.target.value})} placeholder="phone number" prefix="📞" />
          </div>
          <Input label="Date of Joining" type="date" value={form.dateOfJoining} onChange={e=>setForm({...form,dateOfJoining:e.target.value})} />

          {!isAdmin && (
            <>
              <Divider label="Assignment" />
              <Select label="Assign Business *" value={form.businessId} onChange={e=>setForm({...form,businessId:e.target.value,departmentId:''})}>

                {businesses.map(b=><option key={b.id} value={b.id}>{b.name}</option>)}
              </Select>
              <Select label="Assign Department *" value={form.departmentId} onChange={e=>setForm({...form,departmentId:e.target.value})}>
                <option value="">— Select Department —</option>
                {filteredDepts.map(d=><option key={d.id} value={d.id}>{d.name}</option>)}

          <div style={{display:'flex', gap:'10px', marginTop:'4px'}}>
            <button onClick={save} disabled={saving} style={{...S.btnPrimary,flex:1}}>{saving?'SAVING...':editing?'UPDATE':'CREATE USER'}</button>

        {adminUsers.length > 0 && (
          <>

        <div style={{marginTop: adminUsers.length > 0 ? '16px' : 0}}>
          <SectionHeader label="Staff Users" count={staffUsers.length} />
          <CrudList items={staffUsers}
            onEdit={i=>{setEditing(i);setForm({userId:i.userId,password:i.password,role:'staff',businessId:i.businessId,departmentId:i.departmentId,name:i.name,contact:i.contact||'',dateOfJoining:i.dateOfJoining||'',disabled:!!i.disabled})}}
            onDelete={del}
            renderItem={u=>(
              <div>
                <div style={{display:'flex', alignItems:'center', gap:'8px', flexWrap:'wrap'}}>
                  <span style={{fontFamily:"'Barlow Condensed',sans-serif",fontWeight:'800',fontSize:'0.95rem',color:'var(--fg)'}}>{u.name.toUpperCase()}</span>
                  <span style={{fontFamily:"'IBM Plex Mono',monospace",fontSize:'0.68rem',color:'#6366f1'}}>@{u.userId}</span>

      </div>
    </div>
  );
}

function CreateTask({ ctx }) {
  const { tasks, businesses, departments, navigate, refreshData, showToast, logout, isDark, toggleTheme } = ctx;
  const blank = { name:'', businessId:'', departmentId:'', rank:'1', deadline:'08:00', repeatType:'everyday', startDate:todayStr(), specificDates:[], intervalDays:2, active:true };
  const [form, setForm]       = useState(blank);
  const [editing, setEditing] = useState(null);
  const [saving, setSaving]   = useState(false);
  const [addingDate, setAddingDate] = useState('');

  const filteredDepts = departments.filter(d => d.businessId === form.businessId);

  const save = async () => {
    if (!form.name||!form.businessId||!form.departmentId) { showToast('Fill required fields','error'); return; }
    setSaving(true);
    try {
      const data = { ...form, name:form.name.trim().toUpperCase(), rank:parseInt(form.rank)||1, updatedAt:new Date() };
      if (editing) { await db.collection('tasks').doc(editing.id).update(data); showToast('Task updated','success'); }
      else { await db.collection('tasks').add({...data,createdAt:new Date()}); showToast('Task created','success'); }
      await refreshData(); setForm(blank); setEditing(null);
    } catch(e) { showToast('Error','error'); }
    setSaving(false);
  };

  const del = async (item) => {
    if (!confirm(`Delete "${item.name}"?`)) return;
    await db.collection('tasks').doc(item.id).delete();
    await refreshData(); showToast('Deleted','success');
  };

  const addDate = () => {
    if (!addingDate||form.specificDates.includes(addingDate)) return;
    setForm({...form,specificDates:[...form.specificDates,addingDate].sort()});
    setAddingDate('');
  };

  const enterBulkRank = (taskList) => {
    const init = {};
    taskList.forEach(t => { init[t.id] = String(t.rank || 1); });
    setBulkRanks(init);
    setBulkRankMode(true);
  };

  const autoNumber = (taskList) => {
    const updated = {...bulkRanks};
    taskList.forEach((t, i) => { updated[t.id] = String(i + 1); });
    setBulkRanks(updated);
  };

  const saveBulkRanks = async (taskList) => {
    setBulkSaving(true);
    try {
      await Promise.all(
        taskList.map(t => db.collection('tasks').doc(t.id).update({ rank: parseInt(bulkRanks[t.id]) || 1, updatedAt: new Date() }))
      );
      await refreshData();
      showToast('Ranks updated!', 'success');
      setBulkRankMode(false);
    } catch(e) { showToast('Error saving ranks', 'error'); }
    setBulkSaving(false);
  };

  const [taskSearch, setTaskSearch] = useState('');
  const [filterBiz,  setFilterBiz]  = useState('');
  const [filterDept, setFilterDept] = useState('');
  const [sortBy,     setSortBy]     = useState('rank');
  const [bulkRankMode, setBulkRankMode] = useState(false);
  const [bulkRanks,    setBulkRanks]    = useState({});
  const [bulkSaving,   setBulkSaving]   = useState(false);

  const getBizName  = id => businesses.find(b=>b.id===id)?.name||'?';
  const getDeptName = id => departments.find(d=>d.id===id)?.name||'?';
  const filterDepts = filterBiz ? departments.filter(d=>d.businessId===filterBiz) : departments;

  const filtered = [...tasks]
    .filter(t => !taskSearch || t.name.toLowerCase().includes(taskSearch.toLowerCase()))
    .filter(t => !filterBiz  || t.businessId===filterBiz)
    .filter(t => !filterDept || t.departmentId===filterDept)
    .sort((a,b)=>{
      if(sortBy==='rank')     return (parseInt(a.rank)||99)-(parseInt(b.rank)||99);
      if(sortBy==='name')     return a.name.localeCompare(b.name);
      if(sortBy==='deadline') return (a.deadline||'').localeCompare(b.deadline||'');
      if(sortBy==='biz')      return getBizName(a.businessId).localeCompare(getBizName(b.businessId));
      return 0;
    });

  return (
    <div style={S.page}>
      <AdminHeader title="CREATE TASK" subtitle="Step 04" onBack={() => navigate('adminDash')} onLogout={logout} isDark={isDark} onToggleDark={toggleTheme} navigate={navigate} currentScreen="createTask" />
      <div style={S.section} className="desktop-grid">
        <FormCard>
          <Input label="Task Name *" value={form.name} onChange={e=>setForm({...form,name:e.target.value.toUpperCase()})} placeholder="TASK NAME" />
          <Select label="Select Business *" value={form.businessId} onChange={e=>setForm({...form,businessId:e.target.value,departmentId:''})}>
            <option value="">— Select Business —</option>
            {businesses.map(b=><option key={b.id} value={b.id}>{b.name}</option>)}
          </Select>
          <Select label="Select Department *" value={form.departmentId} onChange={e=>setForm({...form,departmentId:e.target.value})}>
            <option value="">— Select Department —</option>
            {filteredDepts.map(d=><option key={d.id} value={d.id}>{d.name}</option>)}
          </Select>
          <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:'0 12px'}}>
            <Input label="Rank / Order" type="number" min="1" value={form.rank} onChange={e=>setForm({...form,rank:e.target.value})} hint="1 = top priority" prefix="#" />
            <Input label="Deadline Time" type="time" value={form.deadline} onChange={e=>setForm({...form,deadline:e.target.value})} />
          </div>

          <Divider label="Schedule" />
          <Select label="Repeat Frequency" value={form.repeatType} onChange={e=>setForm({...form,repeatType:e.target.value})}>
            <option value="everyday">Every Day</option>
            <option value="specific">Specific Days Only</option>
            <option value="afterX">Every X Days</option>
          </Select>

          {form.repeatType==='everyday' && (
            <Input label="Start Date" type="date" value={form.startDate} onChange={e=>setForm({...form,startDate:e.target.value})} />
          )}
          {form.repeatType==='specific' && (
            <div style={{marginBottom:'14px'}}>
              <label style={S.label}>Select Specific Dates</label>
              <div style={{display:'flex', gap:'8px', marginBottom:'8px'}}>
                <input type="date" value={addingDate} onChange={e=>setAddingDate(e.target.value)} style={{...S.input,flex:1}} />
                <button onClick={addDate} style={{...S.btnPrimary,padding:'11px 16px',flexShrink:0}}>+ ADD</button>
              </div>
              <div style={{display:'flex', flexWrap:'wrap', gap:'6px'}}>
                {form.specificDates.map(d=>(
                  <span key={d} onClick={()=>setForm({...form,specificDates:form.specificDates.filter(x=>x!==d)})}
                    style={{background:'#e0e7ff',color:'#4338ca',padding:'5px 12px',borderRadius:'20px',fontSize:'0.72rem',fontFamily:"'IBM Plex Mono',monospace",cursor:'pointer'}}>
                    {d} ×
                  </span>
                ))}
                {form.specificDates.length===0 && <div style={{fontSize:'0.72rem',color:'var(--fg3)',fontFamily:"'IBM Plex Mono',monospace"}}>No dates added yet</div>}
              </div>
            </div>
          )}
          {form.repeatType==='afterX' && (
            <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:'0 12px'}}>
              <Input label="Every X Days" type="number" min="1" value={form.intervalDays} onChange={e=>setForm({...form,intervalDays:parseInt(e.target.value)||1})} />
              <Input label="Start Date" type="date" value={form.startDate} onChange={e=>setForm({...form,startDate:e.target.value})} />
            </div>
          )}

          <ToggleSwitch checked={form.active===false?false:true} onChange={()=>setForm({...form,active:form.active===false?true:false})} label="Task Active" description="Disable to hide from all staff" color="#059669" />

          <div style={{display:'flex', gap:'10px', marginTop:'4px'}}>
            <button onClick={save} disabled={saving} style={{...S.btnPrimary,flex:1}}>{saving?'SAVING...':editing?'UPDATE TASK':'CREATE TASK'}</button>
            {editing && <button onClick={()=>{setEditing(null);setForm(blank)}} style={S.btnGhost}>CANCEL</button>}
          </div>
        </FormCard>

        <SectionHeader label="All Tasks" count={filtered.length !== tasks.length ? `${filtered.length}/${tasks.length}` : tasks.length} />

        {/* ── FILTER BAR ── */}
        <div className="card" style={{padding:'12px 14px', marginBottom:'12px'}}>
          <input
            value={taskSearch} onChange={e=>setTaskSearch(e.target.value)}
            placeholder="🔍  SEARCH TASK NAME..."
            style={{...S.input, marginBottom:'10px', fontFamily:"'Barlow Condensed',sans-serif", fontWeight:'600', letterSpacing:'0.5px', textTransform:'uppercase'}}

          <div style={{display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:'8px'}}>
            <select value={filterBiz} onChange={e=>{setFilterBiz(e.target.value);setFilterDept('');}} style={{...S.input, margin:0, fontSize:'0.72rem', fontFamily:"'Barlow Condensed',sans-serif", fontWeight:'700', letterSpacing:'0.5px'}}>

      </div>
    </div>
  );
}

// ══════════════════════════════════
//  MANAGE BUSINESS  (flat: biz → dept rows directly)
// ══════════════════════════════════
function ManageBusiness({ ctx }) {
  const { businesses, departments, tasks, currentUser, navigate, isDark, logout, toggleTheme, today } = ctx;
  const [level, setLevel]         = useState(0);
  const [selBiz, setSelBiz]       = useState(null);
  const [selDept, setSelDept]     = useState(null);
  const [completions, setCompletions] = useState({});
  const [loadingComp, setLoadingComp] = useState(false);
  const [showDone, setShowDone]       = useState(false);

  const loadCompletions = async () => {
    setLoadingComp(true);
    const snap = await db.collection('taskCompletions').where('date','==',todayStr()).get();
    const m = {};
    snap.docs.forEach(d => { m[d.data().taskId] = {id:d.id,...d.data()}; });
    setCompletions(m); setLoadingComp(false);
  };

  useEffect(() => { if (level===1) loadCompletions(); }, [level, today]);

  const completeTask = async (task) => {
    if (completions[task.id]) return;
    await db.collection('taskCompletions').add({ taskId:task.id, date:todayStr(), completedBy:currentUser.name||currentUser.userId, completedAt:new Date(), photoUploaded:false });
    await loadCompletions();
  };

  // Level 1: task table
  if (level===1 && selDept) {
    const dept      = departments.find(d => d.id===selDept);
    const biz       = businesses.find(b => b.id===selBiz);
    const deptTasks = tasks.filter(t => t.businessId===selBiz && t.departmentId===selDept && taskActiveToday(t))
      .sort((a,b) => (parseInt(a.rank)||99)-(parseInt(b.rank)||99));
    const doneCount = deptTasks.filter(t => completions[t.id]).length;

    return (
      <div style={S.page}>
        <AdminHeader title={dept?.name?.toUpperCase()||'DEPT'} subtitle={biz?.name||''} onBack={() => setLevel(0)} onLogout={logout} isDark={isDark} onToggleDark={toggleTheme} navigate={navigate} currentScreen="manageBusiness" />
        <div style={S.section} className="desktop-grid">
          {deptTasks.length > 0 && (
            <div className="card" style={{padding:'12px 16px', marginBottom:'12px'}}>
              <div style={{display:'flex', gap:'16px', alignItems:'center', marginBottom:'10px'}}>
                <div style={{fontFamily:"'IBM Plex Mono',monospace", fontSize:'0.62rem', color:'var(--fg3)', letterSpacing:'1.5px', textTransform:'uppercase'}}>
                  {new Date().toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'}).toUpperCase()}
                </div>
                <div style={{marginLeft:'auto', display:'flex', gap:'14px'}}>
                  <span style={{fontFamily:"'IBM Plex Mono',monospace", fontSize:'0.7rem', textTransform:'uppercase'}}>
                    <span style={{color:'#f59e0b', fontWeight:'700', fontSize:'0.95rem'}}>{deptTasks.length-doneCount}</span>
                    <span style={{color:'var(--fg3)'}}> LEFT</span>
                  </span>
                  <span style={{fontFamily:"'IBM Plex Mono',monospace", fontSize:'0.7rem', textTransform:'uppercase'}}>
                    <span style={{color:'#059669', fontWeight:'700', fontSize:'0.95rem'}}>{doneCount}</span>
                    <span style={{color:'var(--fg3)'}}> DONE</span>
                  </span>
                </div>
              </div>
              <div style={{height:'4px', background:'var(--border)', borderRadius:'2px', overflow:'hidden'}}>
                <div style={{height:'100%', width:`${deptTasks.length?doneCount/deptTasks.length*100:0}%`, background:'linear-gradient(90deg,#f59e0b,#10b981)', borderRadius:'2px', transition:'width 0.6s ease'}}/>
              </div>
            </div>
          )}
          <div style={{display:'flex', justifyContent:'flex-end', marginBottom:'8px'}}>
            <button onClick={loadCompletions} style={{...S.btnSmall,background:'var(--surface2)',color:'var(--fg2)'}}>
              {loadingComp?'⟳':'↻'} REFRESH
            </button>
          </div>
          {deptTasks.length===0 ? <EmptyState icon="📅" text="No tasks today" /> : (
            <>
              {(() => {
                const pendTasks = deptTasks.filter(t => !completions[t.id]);
                const doneT    = deptTasks.filter(t =>  completions[t.id]);
                return (
                  <>
                    {pendTasks.length===0 ? (
                      <div className="card slide-up" style={{padding:'40px 20px', textAlign:'center', marginBottom:'16px'}}>
                        <div style={{fontSize:'2.5rem', marginBottom:'10px'}}>✅</div>
                        <div style={{fontFamily:"'Barlow Condensed',sans-serif", fontWeight:'900', fontSize:'1.3rem', color:'#059669', letterSpacing:'4px', textTransform:'uppercase'}}>ALL DONE!</div>
                        <div style={{fontFamily:"'IBM Plex Mono',monospace", fontSize:'0.64rem', color:'var(--fg3)', marginTop:'6px', letterSpacing:'2px', textTransform:'uppercase'}}>All tasks completed for today</div>
                      </div>
                    ) : (
                      <div className="card" style={{overflow:'hidden', marginBottom:'16px'}}>
                        <div style={{overflowX:'auto'}}>
                          <table className="staff-tbl" style={{width:'100%', borderCollapse:'collapse', minWidth:'380px'}}>
                            <thead>
                              <tr style={{background:'#0b1120'}}>
                                {[
                                  {h:'#',      align:'center', width:'44px'},
                                  {h:'TASK',   align:'left',   width:'auto'},
                                  {h:'TIME',   align:'center', width:'90px'},
                                  {h:'STATUS', align:'center', width:'130px'},
                                ].map(({h,align,width})=>(
                                  <th key={h} style={{...S.th, color:'rgba(255,255,255,0.65)', textAlign:align, width}}>{h}</th>
                                ))}
                              </tr>
                            </thead>
                            <tbody>
                              {pendTasks.map((task,i) => (
                                <tr key={task.id}>
                                  <td style={{...S.td,fontFamily:"'IBM Plex Mono',monospace",fontWeight:'600',color:'#6366f1',textAlign:'center',width:'40px',fontSize:'0.8rem'}}>{i+1}</td>
                                  <td style={{...S.td,fontFamily:"'Barlow Condensed',sans-serif",fontWeight:'700',fontSize:'0.9rem',color:'var(--fg)'}}>{task.name}</td>
                                  <td style={{...S.td,fontFamily:"'IBM Plex Mono',monospace",fontSize:'0.78rem',color:'#dc2626',whiteSpace:'nowrap',textAlign:'center'}}>{task.deadline}</td>
                                  <td style={{...S.td,textAlign:'center'}}>
                                    <button onClick={()=>completeTask(task)} style={{background:'#059669',border:'none',color:'white',padding:'6px 12px',borderRadius:'7px',cursor:'pointer',fontFamily:"'Barlow Condensed',sans-serif",fontWeight:'700',fontSize:'0.75rem',letterSpacing:'1px',textTransform:'uppercase',whiteSpace:'nowrap'}}>
                                      DONE ✓
                                    </button>
                                  </td>
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        </div>
                      </div>
                    )}

                    {doneT.length > 0 && (
                      <div className="fade-in">
                        <div onClick={()=>setShowDone(v=>!v)} style={{display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:'10px', cursor:'pointer', userSelect:'none'}}>
                          <div style={{display:'flex', alignItems:'center', gap:'8px'}}>
                            <span style={{fontFamily:"'Barlow Condensed',sans-serif", fontWeight:'800', fontSize:'0.82rem', color:'#059669', letterSpacing:'2px', textTransform:'uppercase'}}>COMPLETED TODAY</span>
                            <span className="chip" style={{background:'#dcfce7', color:'#166534'}}>{doneT.length}</span>
                          </div>
                          <span style={{fontFamily:"'IBM Plex Mono',monospace", fontSize:'0.72rem', color:'var(--fg3)', letterSpacing:'1px'}}>
                            {showDone?'▲ HIDE':'▼ SHOW'}
                          </span>
                        </div>
                        {showDone && (
                          <div className="card" style={{overflow:'hidden'}}>
                            <div style={{overflowX:'auto'}}>
                              <table className="staff-tbl" style={{width:'100%', borderCollapse:'collapse', minWidth:'380px'}}>
                                <thead>
                                  <tr style={{background:'#064e3b'}}>
                                    {[
                                      {h:'#',    align:'center', width:'44px'},
                                      {h:'TASK', align:'left',   width:'auto'},
                                      {h:'TIME', align:'center', width:'90px'},
                                      {h:'BY',   align:'center', width:'130px'},
                                    ].map(({h,align,width})=>(
                                      <th key={h} style={{...S.th, color:'rgba(255,255,255,0.7)', textAlign:align, width}}>{h}</th>
                                    ))}
                                  </tr>
                                </thead>
                                <tbody>
                                  {doneT.map((task,i)=>{
                                    const comp = completions[task.id];
                                    return (
                                      <tr key={task.id} className="row-done">
                                        <td style={{...S.td, fontFamily:"'IBM Plex Mono',monospace", fontWeight:'600', color:'#059669', textAlign:'center', width:'40px', fontSize:'0.8rem'}}>{i+1}</td>
                                        <td style={{...S.td, fontFamily:"'Barlow Condensed',sans-serif", fontWeight:'700', fontSize:'0.9rem', color:'#065f46'}}>✓ {task.name}</td>
                                        <td style={{...S.td, fontFamily:"'IBM Plex Mono',monospace", fontSize:'0.78rem', color:'#059669', textAlign:'center', whiteSpace:'nowrap'}}>{task.deadline}</td>
                                        <td style={{...S.td, fontFamily:"'IBM Plex Mono',monospace", fontSize:'0.72rem', color:'#064e3b', textAlign:'center', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap', textTransform:'uppercase'}}>
                                          {comp?.completedBy||'—'}
                                        </td>
                                      </tr>
                                    );
                                  })}
                                </tbody>
                              </table>
                            </div>
                          </div>
                        )}
                      </div>
                    )}
                  </>
                );
              })()}
            </>
          )}
        </div>
      </div>
    );
  }

  // Level 0: businesses with departments directly listed
  return (
    <div style={S.page}>
      <AdminHeader title="MANAGE BUSINESS" subtitle="Tap dept to view tasks" onBack={() => navigate('adminDash')} onLogout={logout} isDark={isDark} onToggleDark={toggleTheme} navigate={navigate} currentScreen="manageBusiness" />
      <div style={S.section} className="desktop-grid">
        {businesses.length===0 ? <EmptyState icon="🏢" text="No businesses yet" /> : (
          <div style={{display:'flex', flexDirection:'column', gap:'20px'}}>
            {businesses.map(b => {
              const bizDepts = departments.filter(d => d.businessId===b.id);
              return (
                <div key={b.id}>
                  {/* Business header */}
                  <div style={{
                    display:'flex', alignItems:'center', gap:'8px',
                    fontFamily:"'IBM Plex Mono',monospace", fontSize:'0.65rem',
                    fontWeight:'800', color:'var(--fg3)', letterSpacing:'2px',
                    textTransform:'uppercase', marginBottom:'8px', paddingLeft:'2px'
                  }}>
                    <span>🏢</span>
                    <span>{b.name.toUpperCase()}</span>
                    <div style={{flex:1, height:'1px', background:'var(--border)', marginLeft:'6px'}}/>
                  </div>
                  {/* Dept rows */}
                  {bizDepts.length===0 ? (
                    <div style={{fontSize:'0.75rem',color:'var(--fg3)',fontFamily:"'IBM Plex Mono',monospace",padding:'8px 16px'}}>No departments added</div>
                  ) : (
                    <div style={{display:'flex', flexDirection:'column', gap:'8px'}}>
                      {bizDepts.map(d => {
                        const total = tasks.filter(t => t.businessId===b.id && t.departmentId===d.id && taskActiveToday(t)).length;
                        return (
                          <div key={d.id} className="card tile-hover"
                            onClick={() => { setSelBiz(b.id); setSelDept(d.id); setLevel(1); }}
                            style={{
                              padding:'16px 20px', cursor:'pointer',
                              display:'flex', justifyContent:'space-between', alignItems:'center',
                              borderLeft:'4px solid #f59e0b'
                            }}>
                            <div>
                              <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontWeight:'400',fontSize:'1.05rem',letterSpacing:'0.5px',color:'var(--fg)'}}>{d.name.toUpperCase()}</div>
                              <div style={{fontFamily:"'IBM Plex Mono',monospace",fontSize:'0.7rem',color:'var(--fg3)',marginTop:'3px'}}>{total} TASK{total!==1?'S':''} TODAY</div>
                            </div>
                            <div style={{color:'#6366f1',fontSize:'1.2rem',fontWeight:'bold'}}>→</div>
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        )}
      </div>
    </div>
  );
}

// ══════════════════════════════════
//  REPORTS
// ══════════════════════════════════
function Reports({ ctx }) {
  const { businesses, departments, tasks, navigate, logout, isDark, toggleTheme } = ctx;
  const [date, setDate]           = useState(todayStr());
  const [filterBiz, setFilterBiz] = useState('');
  const [filterDept, setFilterDept] = useState('');
  const [result, setResult]       = useState(null);
  const [loading, setLoading]     = useState(false);

  const filteredDepts = departments.filter(d => !filterBiz || d.businessId===filterBiz);

  const run = async () => {
    setLoading(true); setResult(null);
    try {
      const snap = await db.collection('taskCompletions').where('date','==',date).get();
      const compMap = {};
      snap.docs.forEach(d => { compMap[d.data().taskId] = {id:d.id,...d.data()}; });

      let active = tasks.filter(t => taskActiveOnDate(t, date));
      if (filterBiz)  active = active.filter(t => t.businessId===filterBiz);
      if (filterDept) active = active.filter(t => t.departmentId===filterDept);
      active = active.sort((a,b) => (parseInt(a.rank)||99)-(parseInt(b.rank)||99));

      const rows = active.map(t => {
        const comp     = compMap[t.id];
        const compDate = comp ? tsToDate(comp.completedAt) : null;
        const lateMin  = calcLateMins(t.deadline, compDate);
        return { task:t, comp, compDate, compTimeStr:fmtTime(compDate), lateMin, lateStr:fmtLate(lateMin) };
      });
      setResult({ rows, date });
    } catch(e) { alert('Report error: '+e.message); }
    setLoading(false);
  };

  const getDeptName = id => departments.find(d=>d.id===id)?.name||'?';

  return (
    <div style={S.page}>
      <AdminHeader title="REPORTS" subtitle="Daily Task Report" onBack={() => navigate('adminDash')} onLogout={logout} isDark={isDark} onToggleDark={toggleTheme} navigate={navigate} currentScreen="reports" />
      <div style={S.section} className="desktop-grid">
        <FormCard>
          <Input label="Select Date" type="date" value={date} onChange={e=>setDate(e.target.value)} />
          <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:'0 12px'}}>
            <Select label="Business (opt)" value={filterBiz} onChange={e=>{setFilterBiz(e.target.value);setFilterDept('');}}>
              <option value="">All Businesses</option>
              {businesses.map(b=><option key={b.id} value={b.id}>{b.name}</option>)}
            </Select>
            <Select label="Department (opt)" value={filterDept} onChange={e=>setFilterDept(e.target.value)}>
              <option value="">All Departments</option>
              {filteredDepts.map(d=><option key={d.id} value={d.id}>{d.name}</option>)}
            </Select>
          </div>

          <button onClick={run} disabled={loading} style={{...S.btnPrimary, width:'100%', padding:'14px', letterSpacing:'2px'}}>
            {loading ? '⟳ RUNNING...' : 'RUN REPORT →'}
          </button>
        </FormCard>

        {/* ── DAILY REPORT ── */}
        {result && (
          <>
            <SectionHeader label={`DAILY REPORT — ${result.date}`} count={result.rows.length} />
            {result.rows.length===0 ? <EmptyState icon="📅" text="No tasks scheduled for this date" /> : (
              <div className="card" style={{overflow:'hidden'}}>
                <div style={{overflowX:'auto'}}>
                  <table style={{width:'100%', borderCollapse:'collapse', minWidth:'500px'}}>
                    <thead>
                      <tr style={{background:'#0b1120'}}>
                        {['TASK','NAME','WORK TIME','WORK DONE','LATE'].map((h,i) => (
                          <th key={h} style={{...S.th, color:'rgba(255,255,255,0.7)', textAlign:i>=2?'center':'left'}}>{h}</th>
                        ))}
                      </tr>
                    </thead>
                    <tbody>
                      {result.rows.map(({task, comp, compTimeStr, lateStr, lateMin}) => (
                        <tr key={task.id} style={{
                          borderLeft: !comp ? '3px solid #ef4444' : lateMin > 0 ? '3px solid #f59e0b' : '3px solid #10b981'
                        }}>
                          <td style={{...S.td, maxWidth:'160px'}}>
                            <div style={{fontFamily:"'Barlow Condensed',sans-serif", fontWeight:'700', fontSize:'0.88rem', color:'var(--fg)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>{task.name}</div>
                            <div style={{fontFamily:"'IBM Plex Mono',monospace", fontSize:'0.62rem', color:'var(--fg3)', marginTop:'1px'}}>{getDeptName(task.departmentId)}</div>
                          </td>
                          <td style={{...S.td, fontFamily:"'IBM Plex Mono',monospace", fontSize:'0.78rem', color:'var(--fg2)', whiteSpace:'nowrap'}}>
                            {comp?.completedBy || '—'}
                          </td>
                          <td style={{...S.td, fontFamily:"'IBM Plex Mono',monospace", fontSize:'0.82rem', color:'var(--fg2)', textAlign:'center', whiteSpace:'nowrap'}}>
                            {task.deadline}
                          </td>
                          <td style={{...S.td, textAlign:'center'}}>
                            {comp ? (
                              <span style={{
                                fontFamily:"'IBM Plex Mono',monospace", fontWeight:'600', fontSize:'0.85rem',
                                color: lateMin > 0 ? '#dc2626' : '#059669',
                                background: lateMin > 0 ? '#fef2f2' : '#dcfce7',
                                padding:'4px 10px', borderRadius:'6px', whiteSpace:'nowrap'
                              }}>{compTimeStr}</span>
                            ) : (
                              <span className="chip" style={{background:'#fef2f2', color:'#dc2626'}}>PENDING</span>
                            )}
                          </td>
                          <td style={{...S.td, textAlign:'center', fontFamily:"'IBM Plex Mono',monospace", fontSize:'0.78rem', fontWeight:'600', whiteSpace:'nowrap'}}>
                            {comp ? (
                              <span style={{color: lateMin <= 0 ? '#059669' : '#dc2626'}}>
                                {lateStr}
                              </span>
                            ) : <span style={{color:'var(--fg3)'}}>—</span>}
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}
          </>
        )}
      </div>
    </div>
  );
}

//  STAFF DASHBOARD
// ══════════════════════════════════
function StaffDashboard({ ctx }) {
  const { currentUser, businesses, departments, tasks, logout, isDark, toggleTheme, today } = ctx;
  const [allTasks, setAllTasks]       = useState([]);
  const [completions, setCompletions] = useState({});
  const [loading, setLoading]         = useState(true);
  const [completing, setCompleting]   = useState(null);
  const [showDone, setShowDone]       = useState(false);

  const bizName  = businesses.find(b=>b.id===currentUser.businessId)?.name||'';
  const deptName = departments.find(d=>d.id===currentUser.departmentId)?.name||'';

  const loadAll = async () => {
    setLoading(true);
    const myTasks = tasks.filter(t => t.departmentId===currentUser.departmentId && t.active!==false && taskActiveToday(t))
      .sort((a,b) => (parseInt(a.rank)||99)-(parseInt(b.rank)||99));
    const compSnap = await db.collection('taskCompletions').where('date','==',todayStr()).get();
    const m = {};
    compSnap.docs.forEach(d => { m[d.data().taskId] = {id:d.id,...d.data()}; });
    setAllTasks(myTasks); setCompletions(m); setLoading(false);
  };

  useEffect(() => {
    loadAll();
    const timer = setInterval(loadAll, 90000);
    return () => clearInterval(timer);
  }, [today]);

  const markDone = async (task) => {
    if (completions[task.id]||completing===task.id) return;
    setCompleting(task.id);
    try {
      await db.collection('taskCompletions').add({ taskId:task.id, date:todayStr(), completedBy:currentUser.name||currentUser.userId, completedAt:new Date(), photoUploaded:false });
      setCompletions(prev => ({...prev,[task.id]:{taskId:task.id,date:todayStr(),completedBy:currentUser.name}}));
    } catch(e) {}
    setCompleting(null);
  };

  const pendingTasks = allTasks.filter(t => !completions[t.id]);
  const doneTasks    = allTasks.filter(t =>  completions[t.id]);
  const progress     = allTasks.length ? (doneTasks.length/allTasks.length)*100 : 0;

  return (
    <div style={{minHeight:'100vh', background:'var(--bg)'}}>
      {/* Header */}
      <div style={{background:'#0b1120', padding:'16px 16px 14px', position:'sticky', top:0, zIndex:100, boxShadow:'0 4px 20px rgba(0,0,0,0.4)'}}>
        <div style={{display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:'12px'}}>
          <div style={{flex:1}}>
            <div style={{fontFamily:"'Barlow Condensed',sans-serif", fontWeight:'900', fontSize:'1.4rem', color:'white', letterSpacing:'3px', textTransform:'uppercase'}}>
              {(currentUser.name||currentUser.userId).toUpperCase()}
            </div>
            <div style={{fontFamily:"'IBM Plex Mono',monospace", fontSize:'0.62rem', fontWeight:'600', color:'#f59e0b', marginTop:'2px', letterSpacing:'1.5px', textTransform:'uppercase'}}>
              {bizName.toUpperCase()}{deptName?` › ${deptName.toUpperCase()}`:''}
            </div>
          </div>
          <div style={{display:'flex', gap:'8px', alignItems:'center', flexShrink:0}}>
            <button onClick={toggleTheme} title="Toggle theme" style={{
              background:'rgba(255,255,255,0.08)', border:'1px solid rgba(255,255,255,0.1)',
              color:'white', width:'34px', height:'34px', borderRadius:'8px',
              cursor:'pointer', fontSize:'1rem',
              display:'flex', alignItems:'center', justifyContent:'center'
            }}>{isDark ? '☀️' : '🌙'}</button>
            <button onClick={logout} style={{
              background:'rgba(255,255,255,0.06)', border:'1px solid rgba(255,255,255,0.1)',
              color:'rgba(255,255,255,0.6)', padding:'6px 12px', borderRadius:'7px',
              cursor:'pointer', fontFamily:"'Barlow Condensed',sans-serif",
              fontWeight:'700', fontSize:'0.72rem', letterSpacing:'1px', textTransform:'uppercase'
            }}>LOG OUT</button>
          </div>
        </div>
        <div style={{display:'flex', gap:'16px', alignItems:'center', marginBottom:'10px'}}>
          <div style={{fontFamily:"'IBM Plex Mono',monospace", fontSize:'0.62rem', color:'rgba(255,255,255,0.25)', letterSpacing:'1.5px', textTransform:'uppercase'}}>
            {new Date().toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'}).toUpperCase()}
          </div>
          <div style={{marginLeft:'auto', display:'flex', gap:'14px'}}>
            <span style={{fontFamily:"'IBM Plex Mono',monospace", fontSize:'0.7rem', textTransform:'uppercase'}}>
              <span style={{color:'#fbbf24', fontWeight:'700', fontSize:'0.95rem'}}>{pendingTasks.length}</span>
              <span style={{color:'rgba(255,255,255,0.3)'}}> LEFT</span>
            </span>
            <span style={{fontFamily:"'IBM Plex Mono',monospace", fontSize:'0.7rem', textTransform:'uppercase'}}>
              <span style={{color:'#4ade80', fontWeight:'700', fontSize:'0.95rem'}}>{doneTasks.length}</span>
              <span style={{color:'rgba(255,255,255,0.3)'}}> DONE</span>
            </span>
          </div>
        </div>
        {allTasks.length > 0 && (
          <div style={{height:'4px', background:'rgba(255,255,255,0.08)', borderRadius:'2px', overflow:'hidden'}}>
            <div style={{height:'100%', width:`${progress}%`, background:'linear-gradient(90deg,#f59e0b,#10b981)', borderRadius:'2px', transition:'width 0.6s ease'}}/>
          </div>
        )}
      </div>

      {/* Content */}
      <div style={S.section} className="desktop-grid">
        {loading ? (
          <div style={{textAlign:'center', padding:'60px 20px'}}>
            <div className="pulse" style={{fontFamily:"'IBM Plex Mono',monospace", fontSize:'0.72rem', letterSpacing:'3px', color:'var(--fg3)', textTransform:'uppercase'}}>LOADING TASKS...</div>
          </div>
        ) : allTasks.length===0 ? (
          <EmptyState icon="📅" text="No tasks today" />
        ) : (
          <div className="fade-in">
            <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'10px'}}>
              <span style={{fontFamily:"'IBM Plex Mono',monospace", fontSize:'0.62rem', color:'var(--fg3)', letterSpacing:'1px', textTransform:'uppercase'}}>PENDING TASKS</span>
              <button onClick={loadAll} style={{...S.btnSmall, background:'var(--surface2)', color:'var(--fg2)'}}>
                {loading?'⟳':'↻'} REFRESH
              </button>
            </div>
            {pendingTasks.length===0 ? (
              <div className="card slide-up" style={{padding:'40px 20px', textAlign:'center', marginBottom:'16px'}}>
                <div style={{fontSize:'2.5rem', marginBottom:'10px'}}>✅</div>
                <div style={{fontFamily:"'Barlow Condensed',sans-serif", fontWeight:'900', fontSize:'1.3rem', color:'#059669', letterSpacing:'4px', textTransform:'uppercase'}}>ALL DONE!</div>
                <div style={{fontFamily:"'IBM Plex Mono',monospace", fontSize:'0.64rem', color:'var(--fg3)', marginTop:'6px', letterSpacing:'2px', textTransform:'uppercase'}}>All tasks completed for today</div>
              </div>
            ) : (
              <div className="card" style={{overflow:'hidden', marginBottom:'16px'}}>
                <div style={{overflowX:'auto'}}>
                  <table className="staff-tbl" style={{width:'100%', borderCollapse:'collapse', minWidth:'380px'}}>
                    <thead>
                      <tr style={{background:'#0b1120'}}>
                        {[
                          {h:'#',      align:'center', width:'44px'},
                          {h:'TASK',   align:'left',   width:'auto'},
                          {h:'TIME',   align:'center', width:'90px'},
                          {h:'STATUS', align:'center', width:'130px'},
                        ].map(({h,align,width})=>(
                          <th key={h} style={{...S.th, color:'rgba(255,255,255,0.65)', textAlign:align, width}}>{h}</th>
                        ))}
                      </tr>
                    </thead>
                    <tbody>
                      {pendingTasks.map((task,i) => (
                        <tr key={task.id}>
                          <td style={{...S.td, fontFamily:"'IBM Plex Mono',monospace", fontWeight:'600', color:'#6366f1', textAlign:'center', width:'40px', fontSize:'0.8rem'}}>{i+1}</td>
                          <td style={{...S.td, fontFamily:"'Barlow Condensed',sans-serif", fontWeight:'700', fontSize:'0.9rem', textTransform:'uppercase', color:'var(--fg)'}}>{task.name}</td>
                          <td style={{...S.td, fontFamily:"'IBM Plex Mono',monospace", fontSize:'0.78rem', color:'#dc2626', whiteSpace:'nowrap', textAlign:'center', textTransform:'uppercase'}}>{task.deadline}</td>
                          <td style={{...S.td, textAlign:'center'}}>
                            <button onClick={()=>markDone(task)} disabled={completing===task.id} style={{
                              background: completing===task.id ? '#94a3b8' : '#059669',
                              border:'none', color:'white', padding:'6px 12px', borderRadius:'7px',
                              cursor:'pointer', fontFamily:"'Barlow Condensed',sans-serif",
                              fontWeight:'700', fontSize:'0.75rem', letterSpacing:'1px',
                              textTransform:'uppercase', whiteSpace:'nowrap'
                            }}>
                              {completing===task.id?'⟳':'DONE ✓'}
                            </button>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {doneTasks.length > 0 && (
              <div className="fade-in">
                <div onClick={()=>setShowDone(v=>!v)} style={{display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:'10px', cursor:'pointer', userSelect:'none'}}>
                  <div style={{display:'flex', alignItems:'center', gap:'8px'}}>
                    <span style={{fontFamily:"'Barlow Condensed',sans-serif", fontWeight:'800', fontSize:'0.82rem', color:'#059669', letterSpacing:'2px', textTransform:'uppercase'}}>COMPLETED TODAY</span>
                    <span className="chip" style={{background:'#dcfce7', color:'#166534'}}>{doneTasks.length}</span>
                  </div>
                  <span style={{fontFamily:"'IBM Plex Mono',monospace", fontSize:'0.72rem', color:'var(--fg3)', letterSpacing:'1px'}}>
                    {showDone?'▲ HIDE':'▼ SHOW'}
                  </span>
                </div>
                {showDone && (
                  <div className="card" style={{overflow:'hidden'}}>
                    <div style={{overflowX:'auto'}}>
                      <table className="staff-tbl" style={{width:'100%', borderCollapse:'collapse', minWidth:'380px'}}>
                        <thead>
                          <tr style={{background:'#064e3b'}}>
                            {[
                              {h:'#',    align:'center', width:'44px'},
                              {h:'TASK', align:'left',   width:'auto'},
                              {h:'TIME', align:'center', width:'90px'},
                              {h:'BY',   align:'center', width:'130px'},
                            ].map(({h,align,width})=>(
                              <th key={h} style={{...S.th, color:'rgba(255,255,255,0.7)', textAlign:align, width}}>{h}</th>
                            ))}
                          </tr>
                        </thead>
                        <tbody>
                          {doneTasks.map((task,i)=>{
                            const comp = completions[task.id];
                            return (
                              <tr key={task.id} className="row-done">
                                <td style={{...S.td, fontFamily:"'IBM Plex Mono',monospace", fontWeight:'600', color:'#059669', textAlign:'center', width:'40px', fontSize:'0.8rem'}}>{i+1}</td>
                                <td style={{...S.td, fontFamily:"'Barlow Condensed',sans-serif", fontWeight:'700', fontSize:'0.9rem', color:'#065f46', textTransform:'uppercase'}}>✓ {task.name}</td>
                                <td style={{...S.td, fontFamily:"'IBM Plex Mono',monospace", fontSize:'0.78rem', color:'#059669', textAlign:'center', whiteSpace:'nowrap'}}>{task.deadline}</td>
                                <td style={{...S.td, fontFamily:"'IBM Plex Mono',monospace", fontSize:'0.72rem', color:'#064e3b', textAlign:'center', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap', textTransform:'uppercase'}}>
                                  {comp?.completedBy||'—'}
                                </td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>
                  </div>
                )}
              </div>
            )}
          </div>
        )}
      </div>

      <div style={{padding:'8px 16px 28px', textAlign:'center', fontFamily:"'IBM Plex Mono',monospace", fontSize:'0.58rem', color:'var(--fg3)', letterSpacing:'2px', textTransform:'uppercase'}}>
        TASKFLOW · NDC1877 · {todayStr()}
      </div>
    </div>
  );
}

// ══════════════════════════════════
//  MOUNT
// ══════════════════════════════════
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
