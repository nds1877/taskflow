const todayStr = () => new Date().toISOString().split('T')[0];
const todayDate = () => new Date(todayStr() + 'T00:00:00');

function taskActiveToday(task) {
  const now = todayStr();
  if (!task.active && task.active !== undefined) return false;
  if (task.repeatType === 'everyday') return task.startDate <= now;
  if (task.repeatType === 'specific') return (task.specificDates || []).includes(now);
  if (task.repeatType === 'afterX') {
    if (!task.startDate || task.startDate > now) return false;
    const start = new Date(task.startDate + 'T00:00:00');
    const curr  = new Date(now + 'T00:00:00');
    const diff  = Math.round((curr - start) / 86400000);
    return diff % (parseInt(task.intervalDays) || 1) === 0;
  }
  return false;
}

function EmptyState({ text }) {

    </div>

}

function Toast({ msg, type, onClose }) {
  useEffect(() => { if (msg) { const t = setTimeout(onClose, 2800); return () => clearTimeout(t); } }, [msg]);
  if (!msg) return null;
  const colors = { success:'#10b981', error:'#ef4444', info:'#3b82f6' };
  return (
    <div style={{position:'fixed', bottom:'20px', left:'50%', transform:'translateX(-50%)', background:colors[type]||colors.info, color:'white', padding:'10px 20px', borderRadius:'10px', fontFamily:'\'Barlow Condensed\',sans-serif', fontWeight:'700', letterSpacing:'1px', textTransform:'uppercase', fontSize:'0.85rem', zIndex:9999, boxShadow:'0 8px 25px rgba(0,0,0,0.25)', animation:'fadeIn 0.2s ease', maxWidth:'90vw', textAlign:'center', cursor:'pointer'}} onClick={onClose}>
      {msg}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════════
//  CRUD LIST
// ═══════════════════════════════════════════════════════════════════════
function CrudList({ items, onEdit, onDelete, renderItem }) {
  if (!items.length) return <EmptyState text="No records yet" />;
  return (
    <div style={{display:'flex', flexDirection:'column', gap:'8px'}}>
      {items.map(item => (
        <div key={item.id} className="card fade-in" style={{padding:'14px 16px', display:'flex', justifyContent:'space-between', alignItems:'center'}}>
          <div style={{flex:1, minWidth:0}}>{renderItem(item)}</div>
          <div style={{display:'flex', gap:'6px', marginLeft:'10px', flexShrink:0}}>
            <button onClick={() => onEdit(item)} style={{...S.btnSmall, background:'#eff6ff', color:'#2563eb'}}>EDIT</button>
            <button onClick={() => onDelete(item)} style={{...S.btnSmall, background:'#fef2f2', color:'#dc2626'}}>DEL</button>
          </div>
        </div>
      ))}
    </div>
  );
}

function App() {
  const [currentUser, setCurrentUser] = useState(null);
  const [screen, setScreen]           = useState('login');
  const [navData, setNavData]         = useState(null);
  const [businesses, setBusinesses]   = useState([]);
  const [departments, setDepartments] = useState([]);
  const [users, setUsers]             = useState([]);
  const [tasks, setTasks]             = useState([]);
  const [loading, setLoading]         = useState(true);
  const [toast, setToast]             = useState({ msg:'', type:'info' });

  const showToast = (msg, type='info') => setToast({ msg, type });
  const hideToast = () => setToast({ msg:'', type:'info' });

  const refreshData = useCallback(async () => {
    try {
      const [bS, dS, uS, tS] = await Promise.all([
        db.collection('businesses').get(),
        db.collection('departments').get(),
        db.collection('users').get(),
        db.collection('tasks').get(),
      ]);
      setBusinesses(bS.docs.map(d => ({ id:d.id, ...d.data() })));
      setDepartments(dS.docs.map(d => ({ id:d.id, ...d.data() })));
      setUsers(uS.docs.map(d => ({ id:d.id, ...d.data() })));
      setTasks(tS.docs.map(d => ({ id:d.id, ...d.data() })));
    } catch(e) { /* Firebase may not be configured */ }
  }, []);

  useEffect(() => {
    seedAdmins().then(() => refreshData().then(() => setLoading(false)));
    const saved = localStorage.getItem('tf_staff');
    if (saved) {
      try {
        const u = JSON.parse(saved);
        if (u.role === 'staff') { setCurrentUser(u); setScreen('staff'); }
      } catch(e) {}
    }
  }, []);

  const navigate = (s, data = null) => { setScreen(s); setNavData(data); };

  const logout = () => {
    localStorage.removeItem('tf_staff');
    setCurrentUser(null);
    setScreen('login');
  };

  if (loading) {
    return (
      <div style={{minHeight:'100vh', display:'flex', alignItems:'center', justifyContent:'center', background:'var(--navy)', flexDirection:'column', gap:'12px'}}>
        <div style={{fontFamily:'\'Barlow Condensed\',sans-serif', fontWeight:'900', fontSize:'2rem', color:'var(--amber)', letterSpacing:'6px'}}>TASKFLOW</div>
        <div style={{color:'rgba(255,255,255,0.3)', fontFamily:'\'IBM Plex Mono\',monospace', fontSize:'0.75rem', letterSpacing:'2px'}} className="pulse">LOADING...</div>
      </div>
    );
  }

  const ctx = { currentUser, businesses, departments, users, tasks, navigate, refreshData, logout, showToast };

  const screens = {
    login:            <LoginScreen ctx={ctx} setCurrentUser={setCurrentUser} setScreen={setScreen} />,
    adminDash:        <AdminDashboard ctx={ctx} />,
    createBusiness:   <CreateBusiness ctx={ctx} />,
    createDepartment: <CreateDepartment ctx={ctx} />,
    createUser:       <CreateUser ctx={ctx} />,
    createTask:       <CreateTask ctx={ctx} />,
    manageBusiness:   <ManageBusiness ctx={ctx} />,
    reports:          <Reports ctx={ctx} />,
    staff:            <StaffDashboard ctx={ctx} />,
  };

  return (
    <>
      {screens[screen] || screens.login}
      <Toast msg={toast.msg} type={toast.type} onClose={hideToast} />
    </>
  );
}

// ═══════════════════════════════════════════════════════════════════════
//  LOGIN  — with show/hide password toggle
// ═══════════════════════════════════════════════════════════════════════
function LoginScreen({ ctx, setCurrentUser, setScreen }) {
  const [userId,   setUserId]   = useState('');
  const [password, setPassword] = useState('');
  const [showPw,   setShowPw]   = useState(false);
  const [error,    setError]    = useState('');
  const [loading,  setLoading]  = useState(false);
  const pwRef = useRef();

  const login = async () => {
    if (!userId.trim() || !password) { setError('Enter User ID and Password'); return; }
    setLoading(true); setError('');
    try {
      const snap = await db.collection('users')
        .where('userId', '==', userId.trim().toLowerCase())
        .where('password', '==', password)
        .limit(1).get();
      if (snap.empty) { setError('Invalid credentials'); setLoading(false); return; }
      const user = { id: snap.docs[0].id, ...snap.docs[0].data() };
      if (user.disabled) { setError('Account disabled. Contact admin.'); setLoading(false); return; }
      setCurrentUser(user);
      if (user.role === 'staff') {
        localStorage.setItem('tf_staff', JSON.stringify(user));
        setScreen('staff');
      } else {
        setScreen('adminDash');
      }
    } catch(e) { setError('Connection error. Check Firebase config in HTML file.'); }
    setLoading(false);
  };

  // Eye icon SVGs
  const EyeOpen = () => (
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
    </svg>
  );
  const EyeOff = () => (
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/>
      <line x1="1" y1="1" x2="23" y2="23"/>
    </svg>
  );

  return (
    <div style={{minHeight:'100vh', background:'var(--navy)', display:'flex', alignItems:'center', justifyContent:'center', padding:'20px', position:'relative', overflow:'hidden'}}>
      <div style={{position:'absolute', inset:0, backgroundImage:'repeating-linear-gradient(0deg,transparent,transparent 39px,rgba(255,255,255,0.03) 39px,rgba(255,255,255,0.03) 40px),repeating-linear-gradient(90deg,transparent,transparent 39px,rgba(255,255,255,0.03) 39px,rgba(255,255,255,0.03) 40px)', pointerEvents:'none'}}></div>
      <div style={{width:'100%', maxWidth:'360px', position:'relative'}}>
        <div style={{textAlign:'center', marginBottom:'40px'}}>
          <div style={{fontFamily:'\'Barlow Condensed\',sans-serif', fontWeight:'900', fontSize:'3rem', color:'var(--amber)', letterSpacing:'8px', lineHeight:1}}>TASKFLOW</div>
          <div style={{fontFamily:'\'IBM Plex Mono\',monospace', fontSize:'0.65rem', color:'rgba(255,255,255,0.25)', letterSpacing:'3px', marginTop:'6px', textTransform:'uppercase'}}>Business Task Management</div>
        </div>
        <div style={{background:'rgba(255,255,255,0.04)', border:'1px solid rgba(255,255,255,0.08)', borderRadius:'14px', padding:'28px 24px', backdropFilter:'blur(20px)'}}>
          {/* User ID */}
          <div style={{marginBottom:'14px'}}>
            <label style={{...S.label, color:'rgba(255,255,255,0.4)'}}>User ID</label>
            <input
              value={userId}
              onChange={e => setUserId(e.target.value)}
              onKeyDown={e => e.key==='Enter' && pwRef.current.focus()}
              placeholder="your user id"
              style={{...S.input, background:'rgba(255,255,255,0.06)', border:'1.5px solid rgba(255,255,255,0.1)', color:'white'}}
            />
          </div>
          {/* Password with show/hide toggle */}
          <div style={{marginBottom:'8px'}}>
            <label style={{...S.label, color:'rgba(255,255,255,0.4)'}}>Password</label>
            <div style={{position:'relative'}}>
              <input
                ref={pwRef}
                type={showPw ? 'text' : 'password'}
                value={password}
                onChange={e => setPassword(e.target.value)}
                onKeyDown={e => e.key==='Enter' && login()}
                placeholder="••••••••"
                style={{...S.input, background:'rgba(255,255,255,0.06)', border:'1.5px solid rgba(255,255,255,0.1)', color:'white', paddingRight:'46px'}}
              />
              <button
                type="button"
                onClick={() => setShowPw(v => !v)}
                style={{position:'absolute', right:'12px', top:'50%', transform:'translateY(-50%)', background:'none', border:'none', cursor:'pointer', color:'rgba(255,255,255,0.4)', display:'flex', alignItems:'center', padding:'4px'}}
                tabIndex={-1}
              >
                {showPw ? <EyeOff /> : <EyeOpen />}
              </button>
            </div>
          </div>
          {error && <div style={{color:'#f87171', fontSize:'0.8rem', fontFamily:'\'IBM Plex Mono\',monospace', marginBottom:'12px', padding:'8px 12px', background:'rgba(239,68,68,0.1)', borderRadius:'6px'}}>{error}</div>}

          DEFAULT ADMINS: mayank · sunny · himesh<br/>PASSWORD: [name]123

//  CREATE BUSINESS

function CreateBusiness({ ctx }) {
  const { businesses, navigate, refreshData, showToast } = ctx;
  const [name,    setName]    = useState('');
  const [editing, setEditing] = useState(null);
  const [saving,  setSaving]  = useState(false);

  const save = async () => {
    if (!name.trim()) return;
    setSaving(true);
    try {
      if (editing) {
        await db.collection('businesses').doc(editing.id).update({ name: name.trim() });
        showToast('Business updated', 'success');
      } else {
        await db.collection('businesses').add({ name: name.trim(), createdAt: new Date() });
        showToast('Business created', 'success');
      }
      await refreshData(); setName(''); setEditing(null);
    } catch(e) { showToast('Error: ' + e.message, 'error'); }
    setSaving(false);
  };

  const del = async (item) => {
    if (!confirm(`Delete "${item.name}"?`)) return;
    await db.collection('businesses').doc(item.id).delete();
    await refreshData(); showToast('Deleted', 'success');
  };

  return (
    <div style={S.page}>

      </div>
    </div>

}

// ═══════════════════════════════════════════════════════════════════════
//  MANAGE BUSINESS  — photo column removed from task table
// ═══════════════════════════════════════════════════════════════════════
function ManageBusiness({ ctx }) {
  const { businesses, departments, tasks, currentUser, navigate } = ctx;
  const [level,        setLevel]        = useState(0);
  const [selBiz,       setSelBiz]       = useState(null);
  const [selDept,      setSelDept]      = useState(null);
  const [completions,  setCompletions]  = useState({});
  const [loadingComp,  setLoadingComp]  = useState(false);

  const loadCompletions = async () => {
    setLoadingComp(true);
    const snap = await db.collection('taskCompletions').where('date','==',todayStr()).get();
    const m = {};
    snap.docs.forEach(d=>{ m[d.data().taskId]={id:d.id,...d.data()}; });
    setCompletions(m); setLoadingComp(false);
  };

  useEffect(() => { if (level===2) loadCompletions(); }, [level]);

  const completeTask = async (task) => {
    if (completions[task.id]) return;
    await db.collection('taskCompletions').add({
      taskId: task.id, date: todayStr(),
      completedBy: currentUser.name || currentUser.userId,
      completedAt: new Date()
    });
    await loadCompletions();
  };

  // Level 2: task table
  if (level===2 && selDept) {
    const dept      = departments.find(d=>d.id===selDept);
    const deptTasks = tasks.filter(t=>t.businessId===selBiz&&t.departmentId===selDept&&taskActiveToday(t))
      .sort((a,b)=>(a.rank||'3').localeCompare(b.rank||'3'));

    return (
      <div style={S.page}>
        <AdminHeader title={dept?.name?.toUpperCase()||'DEPARTMENT'} onBack={()=>setLevel(1)} />
        <div style={S.section}>
          <div style={{fontFamily:'\'IBM Plex Mono\',monospace', fontSize:'0.72rem', color:'var(--slate)', marginBottom:'14px', display:'flex', justifyContent:'space-between'}}>
            <span>{todayStr().toUpperCase()} · {deptTasks.length} TASKS</span>
            <span style={{cursor:'pointer', fontSize:'0.8rem', color:loadingComp?'var(--amber)':'var(--slate)'}} onClick={loadCompletions}>↻ REFRESH</span>
          </div>
          {deptTasks.length===0 ? <EmptyState text="No tasks scheduled today" /> : (
            <div className="card" style={{overflow:'hidden'}}>
              <div style={{overflowX:'auto'}}>
                <table style={{width:'100%', borderCollapse:'collapse', minWidth:'360px'}}>
                  <thead>
                    <tr style={{background:'var(--navy)'}}>
                      {['SL','TASK','DEADLINE','STATUS'].map(h=>(
                        <th key={h} style={{...S.th, color:'rgba(255,255,255,0.7)', padding:'12px 10px'}}>{h}</th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {deptTasks.map((task,i)=>{
                      const comp = completions[task.id];
                      return (
                        <tr key={task.id} style={{background:comp?'#f0fdf4':'white'}}>
                          <td style={{...S.td, fontFamily:'\'IBM Plex Mono\',monospace', fontWeight:'600', color:'#6366f1', textAlign:'center', width:'40px'}}>{i+1}</td>
                          <td style={{...S.td, fontFamily:'\'Barlow Condensed\',sans-serif', fontWeight:'700', fontSize:'0.95rem'}}>{task.name}</td>
                          <td style={{...S.td, fontFamily:'\'IBM Plex Mono\',monospace', fontSize:'0.8rem', color:'#dc2626', whiteSpace:'nowrap', textAlign:'center'}}>{task.deadline}</td>
                          <td style={{...S.td, textAlign:'center'}}>
                            {comp ? (
                              <div>
                                <div style={{fontFamily:'\'Barlow Condensed\',sans-serif', fontWeight:'800', color:'#059669', letterSpacing:'1px', fontSize:'0.85rem'}}>✓ DONE</div>
                                <div style={{fontFamily:'\'IBM Plex Mono\',monospace', fontSize:'0.65rem', color:'var(--slate)'}}>{comp.completedBy}</div>
                              </div>
                            ) : (
                              <button onClick={()=>completeTask(task)}
                                style={{background:'#059669', border:'none', color:'white', padding:'6px 12px', borderRadius:'7px', cursor:'pointer', fontFamily:'\'Barlow Condensed\',sans-serif', fontWeight:'700', fontSize:'0.78rem', letterSpacing:'1px', textTransform:'uppercase', whiteSpace:'nowrap'}}>
                                MARK ✓
                              </button>
                            )}
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            </div>
          )}
        </div>
      </div>
    );
  }

  // Level 1: departments
  if (level===1 && selBiz) {
    const biz      = businesses.find(b=>b.id===selBiz);
    const bizDepts = departments.filter(d=>d.businessId===selBiz);
    return (
      <div style={S.page}>
        <AdminHeader title={biz?.name?.toUpperCase()||'BUSINESS'} onBack={()=>setLevel(0)} />
        <div style={S.section}>
          {bizDepts.length===0 ? <EmptyState text="No departments" /> : (
            <div style={{display:'flex', flexDirection:'column', gap:'10px'}}>
              {bizDepts.map(d=>{
                const cnt = tasks.filter(t=>t.departmentId===d.id&&taskActiveToday(t)).length;
                return (
                  <div key={d.id} className="card" onClick={()=>{setSelDept(d.id);setLevel(2)}}
                    style={{padding:'18px 20px', cursor:'pointer', display:'flex', justifyContent:'space-between', alignItems:'center', border:'2px solid #f1f5f9', transition:'border 0.15s'}}>
                    <div>
                      <div style={{fontFamily:'\'Barlow Condensed\',sans-serif', fontWeight:'800', fontSize:'1.05rem', letterSpacing:'0.5px'}}>{d.name.toUpperCase()}</div>
                      <div style={{fontFamily:'\'IBM Plex Mono\',monospace', fontSize:'0.72rem', color:'var(--slate)', marginTop:'2px'}}>{cnt} TASKS TODAY</div>
                    </div>
                    <span style={{color:'#6366f1', fontSize:'1.2rem'}}>→</span>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      </div>
    );
  }

  // Level 0: businesses
  return (
    <div style={S.page}>
      <AdminHeader title="MANAGE BUSINESS" onBack={()=>navigate('adminDash')} />
      <div style={S.section}>
        {businesses.length===0 ? <EmptyState text="No businesses created yet" /> : (
          <div style={{display:'flex', flexDirection:'column', gap:'12px'}}>
            {businesses.map(b=>{
              const dCnt = departments.filter(d=>d.businessId===b.id).length;
              const tCnt = tasks.filter(t=>t.businessId===b.id&&taskActiveToday(t)).length;
              return (
                <div key={b.id} className="card" onClick={()=>{setSelBiz(b.id);setLevel(1)}}
                  style={{padding:'20px', cursor:'pointer', borderLeft:'4px solid var(--amber)', transition:'transform 0.1s'}}
                  onTouchStart={e=>e.currentTarget.style.transform='scale(0.98)'}
                  onTouchEnd={e=>e.currentTarget.style.transform='scale(1)'}>
                  <div style={{fontFamily:'\'Barlow Condensed\',sans-serif', fontWeight:'900', fontSize:'1.2rem', letterSpacing:'2px'}}>{b.name.toUpperCase()}</div>
                  <div style={{display:'flex', gap:'14px', marginTop:'8px'}}>
                    <span className="chip" style={{background:'#e0e7ff', color:'#4338ca'}}>{dCnt} DEPTS</span>
                    <span className="chip" style={{background:'#dcfce7', color:'#166534'}}>{tCnt} TODAY</span>
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════════
//  REPORTS
// ═══════════════════════════════════════════════════════════════════════
function Reports({ ctx }) {
  const { businesses, departments, tasks, navigate } = ctx;
  const [type,     setType]     = useState('overdue');
  const [dateFrom, setDateFrom] = useState(todayStr());
  const [dateTo,   setDateTo]   = useState(todayStr());
  const [result,   setResult]   = useState(null);
  const [loading,  setLoading]  = useState(false);

  const run = async () => {
    setLoading(true); setResult(null);
    try {
      if (type==='overdue') {
        const snap = await db.collection('taskCompletions').where('date','==',todayStr()).get();
        const done = new Set(snap.docs.map(d=>d.data().taskId));
        const overdue = tasks.filter(t=>taskActiveToday(t)&&!done.has(t.id));
        setResult({ type:'overdue', items:overdue });
      } else if (type==='deptWise') {
        const snap = await db.collection('taskCompletions').where('date','>=',dateFrom).where('date','<=',dateTo).get();
        const byDept = {};
        snap.docs.forEach(d=>{
          const t = tasks.find(x=>x.id===d.data().taskId);
          if (!t) return;
          byDept[t.departmentId] = (byDept[t.departmentId]||0)+1;
        });
        setResult({ type:'deptWise', items: departments.map(d=>({...d, bizName:businesses.find(b=>b.id===d.businessId)?.name||'?', completed:byDept[d.id]||0})), dateFrom, dateTo });
      }
    } catch(e) { alert('Report error: '+e.message); }
    setLoading(false);
  };

  const getBizName  = id => businesses.find(b=>b.id===id)?.name||'?';
  const getDeptName = id => departments.find(d=>d.id===id)?.name||'?';

  return (
    <div style={S.page}>
      <AdminHeader title="REPORTS" onBack={()=>navigate('adminDash')} />
      <div style={S.section}>
        <div className="card" style={{padding:'20px', marginBottom:'20px'}}>
          <Select label="Report Type" value={type} onChange={e=>{setType(e.target.value);setResult(null)}}>
            <option value="overdue">Tasks Not Completed Today</option>
            <option value="deptWise">Completed / Pending — Department Wise</option>
          </Select>
          {type==='deptWise' && (
            <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:'0 12px'}}>
              <Input label="From Date" type="date" value={dateFrom} onChange={e=>setDateFrom(e.target.value)} />
              <Input label="To Date"   type="date" value={dateTo}   onChange={e=>setDateTo(e.target.value)} />
            </div>
          )}
          <button onClick={run} disabled={loading} style={{...S.btnPrimary, width:'100%', padding:'14px', letterSpacing:'3px'}}>
            {loading ? 'RUNNING...' : 'RUN REPORT'}
          </button>
        </div>

        {result?.type==='overdue' && (
          <>
            <SectionHeader label={`Overdue Today (${result.items.length})`} />
            {result.items.length===0
              ? <div className="card" style={{padding:'30px', textAlign:'center'}}>
                  <div style={{fontSize:'2rem',marginBottom:'8px'}}>✅</div>
                  <div style={{fontFamily:'\'Barlow Condensed\',sans-serif',fontWeight:'800',color:'#059669',letterSpacing:'2px',fontSize:'1rem'}}>ALL TASKS COMPLETED TODAY!</div>
                </div>
              : result.items.map(t=>(
                  <div key={t.id} className="card" style={{padding:'14px 16px', marginBottom:'8px', borderLeft:'4px solid #ef4444'}}>
                    <div style={{fontFamily:'\'Barlow Condensed\',sans-serif',fontWeight:'700',fontSize:'0.95rem'}}>{t.name}</div>
                    <div style={{fontFamily:'\'IBM Plex Mono\',monospace',fontSize:'0.7rem',color:'var(--slate)',marginTop:'3px'}}>{getBizName(t.businessId)} › {getDeptName(t.departmentId)} · ⏰ {t.deadline}</div>
                  </div>
                ))
            }
          </>
        )}

        {result?.type==='deptWise' && (
          <>
            <SectionHeader label={`${result.dateFrom} → ${result.dateTo}`} />
            {result.items.map(d=>(
              <div key={d.id} className="card" style={{padding:'14px 16px', marginBottom:'8px', display:'flex', justifyContent:'space-between', alignItems:'center'}}>
                <div>
                  <div style={{fontFamily:'\'Barlow Condensed\',sans-serif',fontWeight:'700',fontSize:'0.95rem'}}>{d.name.toUpperCase()}</div>
                  <div style={{fontFamily:'\'IBM Plex Mono\',monospace',fontSize:'0.7rem',color:'var(--slate)'}}>{d.bizName}</div>
                </div>
                <span className="chip" style={{background:'#dcfce7',color:'#166534',fontSize:'0.85rem'}}>✓ {d.completed}</span>
              </div>
            ))}
          </>
        )}
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════════
//  STAFF DASHBOARD
//  Changes: bonus removed · completed tasks section · pull-to-refresh
//           · logout button · photo column removed
// ═══════════════════════════════════════════════════════════════════════
function StaffDashboard({ ctx }) {
  const { currentUser, businesses, departments, tasks, logout } = ctx;
  const [allTasks,    setAllTasks]    = useState([]);
  const [completions, setCompletions] = useState({});
  const [loading,     setLoading]     = useState(true);
  const [completing,  setCompleting]  = useState(null);
  const [showDone,    setShowDone]    = useState(false);

  // Pull-to-refresh state
  const [ptrY,        setPtrY]        = useState(0);
  const [ptrRefresh,  setPtrRefresh]  = useState(false);
  const touchStartY   = useRef(0);
  const wrapRef       = useRef(null);

  const bizName  = businesses.find(b=>b.id===currentUser.businessId)?.name||'';
  const deptName = departments.find(d=>d.id===currentUser.departmentId)?.name||'';

  const loadEverything = async () => {
    setLoading(true);
    const myTasks = tasks
      .filter(t=>t.departmentId===currentUser.departmentId && t.active!==false && taskActiveToday(t))
      .sort((a,b)=>(a.rank||'3').localeCompare(b.rank||'3'));

    try {
      const compSnap = await db.collection('taskCompletions').where('date','==',todayStr()).get();
      const m = {};
      compSnap.docs.forEach(d=>{ m[d.data().taskId]={id:d.id,...d.data()}; });
      setAllTasks(myTasks);
      setCompletions(m);
    } catch(e) {
      setAllTasks(myTasks);
    }
    setLoading(false);
  };

  useEffect(() => {
    loadEverything();
    const timer = setInterval(loadEverything, 90000);
    return () => clearInterval(timer);
  }, []);

  const markDone = async (task) => {
    if (completions[task.id] || completing===task.id) return;
    setCompleting(task.id);
    try {
      await db.collection('taskCompletions').add({
        taskId: task.id, date: todayStr(),
        completedBy: currentUser.name || currentUser.userId,
        completedAt: new Date()
      });
      setCompletions(prev=>({...prev,[task.id]:{taskId:task.id,date:todayStr(),completedBy:currentUser.name}}));
    } catch(e) {}
    setCompleting(null);
  };

  // ── Pull-to-refresh handlers ──────────────────────────────────────
  const handleTouchStart = (e) => {
    const el = wrapRef.current;
    if (el && el.scrollTop === 0) {
      touchStartY.current = e.touches[0].clientY;
    } else {
      touchStartY.current = -1;
    }
  };

  const handleTouchMove = (e) => {
    if (touchStartY.current < 0 || ptrRefresh) return;
    const delta = e.touches[0].clientY - touchStartY.current;
    if (delta > 0) {
      setPtrY(Math.min(delta * 0.45, 72));
    }
  };

  const handleTouchEnd = async () => {
    if (ptrY > 55 && !ptrRefresh) {
      setPtrRefresh(true);
      setPtrY(40);
      await loadEverything();
      setPtrRefresh(false);
    }
    setPtrY(0);
  };

  const pendingTasks   = allTasks.filter(t=>!completions[t.id]);
  const completedTasks = allTasks.filter(t=> completions[t.id]);

  return (
    <div
      ref={wrapRef}
      style={{minHeight:'100vh', background:'#f1f5f9', fontFamily:'\'Barlow Condensed\',sans-serif', textTransform:'uppercase', overflowY:'auto'}}
      onTouchStart={handleTouchStart}
      onTouchMove={handleTouchMove}
      onTouchEnd={handleTouchEnd}
    >
      {/* Pull-to-refresh indicator */}
      {ptrY > 4 && (
        <div style={{
          height: `${ptrY}px`, overflow:'hidden',
          display:'flex', alignItems:'center', justifyContent:'center',
          background:'var(--navy)', transition: ptrRefresh ? 'none' : 'height 0.1s',
        }}>
          <span className={ptrRefresh ? 'ptr-spinner' : ''} style={{fontSize:'1.2rem', color:'var(--amber)', display:'inline-block'}}>
            {ptrRefresh ? '↻' : (ptrY > 55 ? '↓ RELEASE' : '↓ PULL')}
          </span>
        </div>
      )}

      {/* Staff Header */}
      <div style={{background:'var(--navy)', padding:'16px', position:'sticky', top:0, zIndex:100, boxShadow:'0 4px 20px rgba(0,0,0,0.4)'}}>
        <div style={{display:'flex', justifyContent:'space-between', alignItems:'flex-start'}}>
          <div style={{flex:1, minWidth:0}}>
            <div style={{fontWeight:'900', fontSize:'1.3rem', color:'white', letterSpacing:'3px', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>
              {(currentUser.name||currentUser.userId).toUpperCase()}
            </div>
            <div style={{fontFamily:'\'IBM Plex Mono\',monospace', fontSize:'0.68rem', color:'rgba(255,255,255,0.35)', marginTop:'2px', letterSpacing:'1.5px'}}>
              {bizName.toUpperCase()} › {deptName.toUpperCase()}
            </div>
          </div>
          {/* Logout button */}
          <button
            onClick={() => { if(confirm('Log out?')) logout(); }}
            style={{background:'rgba(255,255,255,0.08)', border:'1px solid rgba(255,255,255,0.12)', color:'rgba(255,255,255,0.7)', padding:'7px 12px', borderRadius:'7px', cursor:'pointer', fontFamily:'\'Barlow Condensed\',sans-serif', fontWeight:'700', fontSize:'0.72rem', letterSpacing:'1px', textTransform:'uppercase', flexShrink:0, marginLeft:'10px'}}
          >
            LOG OUT
          </button>
        </div>

        {/* Status bar */}
        <div style={{marginTop:'14px', display:'flex', gap:'20px', alignItems:'center'}}>
          <div style={{fontFamily:'\'IBM Plex Mono\',monospace', fontSize:'0.68rem', color:'rgba(255,255,255,0.35)', letterSpacing:'1.5px'}}>
            {new Date().toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short',year:'numeric'}).toUpperCase()}
          </div>
          <div style={{marginLeft:'auto', display:'flex', gap:'14px'}}>
            <span style={{fontFamily:'\'IBM Plex Mono\',monospace', fontSize:'0.72rem'}}>
              <span style={{color:'#fbbf24', fontWeight:'700', fontSize:'1rem'}}>{pendingTasks.length}</span>
              <span style={{color:'rgba(255,255,255,0.35)'}}> PENDING</span>
            </span>
            <span style={{fontFamily:'\'IBM Plex Mono\',monospace', fontSize:'0.72rem'}}>
              <span style={{color:'#4ade80', fontWeight:'700', fontSize:'1rem'}}>{completedTasks.length}</span>
              <span style={{color:'rgba(255,255,255,0.35)'}}> DONE</span>
            </span>
          </div>
        </div>
      </div>

      {/* Content */}
      <div style={{padding:'16px'}}>
        {loading ? (
          <div style={{textAlign:'center', padding:'60px', color:'var(--slate)'}}>
            <div className="pulse" style={{fontFamily:'\'IBM Plex Mono\',monospace', fontSize:'0.75rem', letterSpacing:'3px', color:'var(--slate)'}}>LOADING TASKS...</div>
          </div>
        ) : (
          <>
            {/* ── PENDING TASKS ── */}
            {pendingTasks.length === 0 ? (
              <div className="card fade-in" style={{padding:'44px 20px', textAlign:'center', marginBottom:'16px'}}>
                <div style={{fontSize:'3rem', marginBottom:'12px'}}>✅</div>
                <div style={{fontFamily:'\'Barlow Condensed\',sans-serif', fontWeight:'900', fontSize:'1.3rem', color:'#059669', letterSpacing:'4px'}}>ALL DONE!</div>
                <div style={{fontFamily:'\'IBM Plex Mono\',monospace', fontSize:'0.72rem', color:'var(--slate)', marginTop:'8px', letterSpacing:'2px'}}>ALL TASKS COMPLETED FOR TODAY</div>
                <div style={{fontSize:'0.72rem', color:'#94a3b8', fontFamily:'\'IBM Plex Mono\',monospace', marginTop:'16px', cursor:'pointer', letterSpacing:'1px'}} onClick={loadEverything}>↻ REFRESH</div>
              </div>
            ) : (
              <div className="fade-in" style={{marginBottom:'16px'}}>
                <div style={{fontFamily:'\'IBM Plex Mono\',monospace', fontSize:'0.68rem', color:'var(--slate)', marginBottom:'10px', display:'flex', justifyContent:'space-between', letterSpacing:'1px'}}>
                  <span>TODAY'S PENDING TASKS</span>
                  <span style={{cursor:'pointer'}} onClick={loadEverything}>↻ REFRESH</span>
                </div>
                <div className="card" style={{overflow:'hidden'}}>
                  <div style={{overflowX:'auto'}}>
                    <table style={{width:'100%', borderCollapse:'collapse', minWidth:'320px'}}>
                      <thead>
                        <tr style={{background:'#0b1120'}}>
                          {['SL','TASK','TIME','✓'].map(h=>(
                            <th key={h} style={{...S.th, color:'rgba(255,255,255,0.6)', padding:'12px 10px', textAlign:['SL','TIME','✓'].includes(h)?'center':'left'}}>{h}</th>
                          ))}
                        </tr>
                      </thead>
                      <tbody>
                        {pendingTasks.map((task,i)=>(
                          <tr key={task.id} style={{background:'white', transition:'background 0.2s'}}>
                            <td style={{...S.td, fontFamily:'\'IBM Plex Mono\',monospace', fontWeight:'600', color:'#6366f1', textAlign:'center', width:'38px'}}>{i+1}</td>
                            <td style={{...S.td, fontFamily:'\'Barlow Condensed\',sans-serif', fontWeight:'800', fontSize:'0.95rem', letterSpacing:'0.5px', paddingRight:'8px'}}>
                              <div>{task.name}</div>
                              <div style={{fontFamily:'\'IBM Plex Mono\',monospace', fontWeight:'400', fontSize:'0.62rem', color:'var(--slate)', marginTop:'1px', textTransform:'uppercase', letterSpacing:'1px'}}>
                                {task.rank==='1'?'★★★':task.rank==='2'?'★★':'★'} PRIORITY
                              </div>
                            </td>
                            <td style={{...S.td, fontFamily:'\'IBM Plex Mono\',monospace', fontWeight:'600', fontSize:'0.82rem', color:'#dc2626', textAlign:'center', whiteSpace:'nowrap', width:'64px'}}>{task.deadline}</td>
                            <td style={{...S.td, textAlign:'center', width:'52px'}}>
                              <button
                                onClick={()=>markDone(task)}
                                disabled={completing===task.id}
                                style={{width:'34px',height:'34px',background:completing===task.id?'#94a3b8':'#059669',border:'none',borderRadius:'8px',color:'white',cursor:'pointer',fontSize:'1rem',display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto',transition:'transform 0.1s',boxShadow:'0 2px 6px rgba(5,150,105,0.3)'}}
                                onTouchStart={e=>e.currentTarget.style.transform='scale(0.9)'}
                                onTouchEnd={e=>e.currentTarget.style.transform='scale(1)'}
                              >
                                {completing===task.id?'…':'✓'}
                              </button>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

            {/* ── COMPLETED TASKS ── */}
            {completedTasks.length > 0 && (
              <div className="fade-in">
                {/* Toggle header */}
                <div
                  onClick={()=>setShowDone(v=>!v)}
                  style={{display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:'10px', cursor:'pointer', userSelect:'none'}}
                >
                  <div style={{display:'flex', alignItems:'center', gap:'8px'}}>
                    <span style={{fontFamily:'\'Barlow Condensed\',sans-serif', fontWeight:'800', fontSize:'0.85rem', color:'#059669', letterSpacing:'2px'}}>COMPLETED TODAY</span>
                    <span className="chip" style={{background:'#dcfce7', color:'#166534'}}>{completedTasks.length}</span>
                  </div>
                  <span style={{fontFamily:'\'IBM Plex Mono\',monospace', fontSize:'0.78rem', color:'#94a3b8', letterSpacing:'1px'}}>
                    {showDone ? '▲ HIDE' : '▼ SHOW'}
                  </span>
                </div>

                {showDone && (
                  <div className="card" style={{overflow:'hidden'}}>
                    <div style={{overflowX:'auto'}}>
                      <table style={{width:'100%', borderCollapse:'collapse', minWidth:'300px'}}>
                        <thead>
                          <tr style={{background:'#064e3b'}}>
                            {['SL','TASK','TIME','BY'].map(h=>(
                              <th key={h} style={{...S.th, color:'rgba(255,255,255,0.7)', padding:'10px 10px', textAlign:['SL','TIME'].includes(h)?'center':'left'}}>{h}</th>
                            ))}
                          </tr>
                        </thead>
                        <tbody>
                          {completedTasks.map((task,i)=>{
                            const comp = completions[task.id];
                            return (
                              <tr key={task.id} style={{background:'#f0fdf4'}}>
                                <td style={{...S.td, fontFamily:'\'IBM Plex Mono\',monospace', fontWeight:'600', color:'#059669', textAlign:'center', width:'38px', borderBottom:'1px solid #d1fae5'}}>{i+1}</td>
                                <td style={{...S.td, fontFamily:'\'Barlow Condensed\',sans-serif', fontWeight:'700', fontSize:'0.92rem', color:'#065f46', borderBottom:'1px solid #d1fae5'}}>
                                  <span style={{marginRight:'6px'}}>✓</span>{task.name}
                                </td>
                                <td style={{...S.td, fontFamily:'\'IBM Plex Mono\',monospace', fontSize:'0.78rem', color:'#059669', textAlign:'center', whiteSpace:'nowrap', width:'64px', borderBottom:'1px solid #d1fae5'}}>{task.deadline}</td>
                                <td style={{...S.td, fontFamily:'\'IBM Plex Mono\',monospace', fontSize:'0.72rem', color:'#064e3b', borderBottom:'1px solid #d1fae5', maxWidth:'90px', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>
                                  {comp?.completedBy || '—'}
                                </td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>
                  </div>
                )}
              </div>
            )}
          </>
        )}
      </div>

      <div style={{padding:'12px 16px 30px', textAlign:'center', fontFamily:'\'IBM Plex Mono\',monospace', fontSize:'0.62rem', color:'#cbd5e1', letterSpacing:'2px'}}>
        TASKFLOW · {todayStr()}
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════════
//  UTILITY COMPONENTS
// ═══════════════════════════════════════════════════════════════════════
function SectionHeader({ label, count }) {
  return (
    <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:'10px', marginTop:'4px'}}>
      <div style={{fontFamily:'\'Barlow Condensed\',sans-serif', fontWeight:'800', fontSize:'0.85rem', color:'#374151', letterSpacing:'2px', textTransform:'uppercase'}}>{label}</div>
      {count!==undefined && <span className="chip" style={{background:'#e2e8f0', color:'#64748b'}}>{count}</span>}
    </div>
  );
}
